# Patient Readmission Analysis
- project: Patient Readmission Analysis
  Technologies: Python, pandas, numpy, matplotlib, seaborn, scikit-learn, JSON, CSV
  Sector: Healthcare
  # url: "#"
  description: The predictive model with logistic regression produced a baseline accuracy and allowed the visualisation of key performance metrics.
               Hospital readmission data is analysed to identify patterns and predict whether patients are likely to be readmitted within 30 days. <br>
               Using a synthetic dataset of 30,000 records, it involves data loading, inspection, cleaning, and preprocessing, including encoding categorical variables and standardizing numerical features. 
               Exploratory data analysis employs histograms, boxplots, pair plots, and correlation heatmaps to reveal trends.
               Feature importance is assessed with permutation importance. <br>The workflow demonstrates a complete Python-based pipeline for healthcare analytics and predictive modeling.

# Breast Cancer Classification
- project: Breast Cancer Classification
  Technologies: Python, Fastai v1, PyTorch, Torchvision, OpenCV, NumPy, pandas, Matplotlib, scikit-learn
  Sector: Healthcare
  # url: "#"
  description: ML model for tumor classification. Metastases in 96×96px histopathology images can be detected using a pretrained DenseNet169 with Fastai v1.
               Images are preprocessed and augmented to improve quality and reduce overfitting. The model is trained with the one-cycle policy and evaluated via accuracy, ROC, and Grad-CAM. <br>
               It can assist pathologists by quickly identifying tumor regions, reducing manual inspection time, and improving early cancer detection and diagnostic accuracy.<br>


# Stroke Risk Prediction
- project: Stroke Risk Prediction
  Technologies: Python, Pandas, NumPy, Matplotlib, Seaborn, Scikit-learn, XGBoost
  Sector: Healthcare
  # url: "#"
  description: Stroke risk is predicted using patient health data. Several machine learning models—including Decision Tree, Random Forest, XGBoost, and Logistic Regression—were trained. <br>
               Random Forest achieved the highest accuracy. <br>
               The model can assist in early stroke detection, prioritize high-risk patients, and guide preventive care strategies. It also allows real-time risk prediction based on individual patient inputs.


